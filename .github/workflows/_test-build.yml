name: Test Build (temporary)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1.328.0
        with:
          ruby-version: '3.1'
          bundler-cache: true
          cache-version: 0
      - name: Build with Jekyll
        run: bundle exec jekyll build
        env:
          JEKYLL_ENV: production
      - name: List built pages
        run: |
          echo "--- key generated files ---"
          ls -la _site/index.html _site/publications/index.html _site/cv/index.html 2>/dev/null || true
          echo "--- publication pages ---"
          ls _site/publication/ 2>/dev/null || true
